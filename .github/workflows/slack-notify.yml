name: CI with Slack notifications

on:
  push:
    branches: [feature/slack-notifications]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to filter tests'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '@regression'
          - '@smoke'
          - '@sanity'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: qa
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci                        # installs from package-lock.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps   # installs Chrome, Firefox etc.

      - name: Run Playwright tests
        run: |
          if [ "${{ github.event.inputs.tag }}" = "all" ]; then
            npx cross-env TEST_ENV=$TEST_ENV playwright test --reporter=list,html
          else
            npx cross-env TEST_ENV=$TEST_ENV playwright test --grep="${{ github.event.inputs.tag }}" --reporter=list,html
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # - name: Notify Slack on success
      #   if: success()
      #   uses: slackapi/slack-github-action@v2.0.0
      #   with:
      #     webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     webhook-type: incoming-webhook
      #     payload: |
      #       {
      #         "text": "✅ *${{ github.repository }}* build passed on `${{ github.ref_name }}`",
      #         "attachments": [{
      #           "color": "good",
      #           "fields": [
      #             { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
      #             { "title": "Commit", "value": "${{ github.sha }}", "short": true }
      #           ]
      #         }]
      #       }

      # - name: Notify Slack on failure
      #   if: failure()
      #   uses: slackapi/slack-github-action@v2.0.0
      #   with:
      #     webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     webhook-type: incoming-webhook
      #     payload: |
      #       {
      #         "text": "❌ *${{ github.repository }}* build failed on `${{ github.ref_name }}`",
      #         "attachments": [{
      #           "color": "danger",
      #           "fields": [
      #             { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
      #             { "title": "Run URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
      #           ]
      #         }]
      #       }

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Tests Passed"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "🏠 *Repository*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                    { "type": "mrkdwn", "text": "🌿 *Branch*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "👤 *Triggered by*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "🏷️ *Tag Filter*\n`${{ github.event.inputs.tag || 'all' }}`" },
                    { "type": "mrkdwn", "text": "🔨 *Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>" },
                    { "type": "mrkdwn", "text": "⏱️ *Run number*\n#${{ github.run_number }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🕐 Completed at ${{ github.event.head_commit.timestamp || 'N/A' }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🔍 View Run" },
                      "style": "primary",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "📂 View Commit" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Tests Failed"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "🏠 *Repository*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                    { "type": "mrkdwn", "text": "🌿 *Branch*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "👤 *Triggered by*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "🏷️ *Tag Filter*\n`${{ github.event.inputs.tag || 'all' }}`" },
                    { "type": "mrkdwn", "text": "🔨 *Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>" },
                    { "type": "mrkdwn", "text": "⏱️ *Run number*\n#${{ github.run_number }}" }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action needed:* Please check the run logs and fix the failing tests."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🕐 Failed at ${{ github.event.head_commit.timestamp || 'N/A' }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "🔍 View Logs" },
                      "style": "danger",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "📂 View Commit" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                    }
                  ]
                }
              ]
            }