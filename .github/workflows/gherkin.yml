name: Gherkin CI

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type (only run when set to gherkin)'
        required: true
        default: 'gherkin'
        type: choice
        options:
        - 'gherkin'
        - 'all'
      tag:
        description: 'Tag to filter tests'
        required: false
        default: 'all'
        type: choice
        options:
        - 'all'
        - '@regression'
        - '@smoke'
        - '@sanity'

jobs:
  gherkin-tests:
    name: Run Gherkin (Cucumber) tests
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'gherkin' }}
    runs-on: ubuntu-latest

    env:
      TEST_ENV: qa
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then npm ci --prefer-offline --no-audit --progress=false; else npm install; fi

    - name: Install Playwright browsers and dependencies
      run: npx playwright install --with-deps

    - name: Run Gherkin tests (ordered + merge + report)
      run: npm run test:gherkin:ordered:report
      env:
        CI: true

    - name: Upload cucumber reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-reports
        path: |
          reports/**
